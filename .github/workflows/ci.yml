# Checks every pull request and every push to main (master plan §13).
# Free on GitHub Actions; nothing here talks to Supabase or any other service.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npm run check:personas
      - name: SQL migrations apply, RLS on every table
        run: npm run db:check
      - name: Core loop on Postgres with RLS
        run: npm run db:test
      - name: App and SQL money agree
        run: npm run test:parity
      - name: Edge Functions
        run: npm run test:functions
