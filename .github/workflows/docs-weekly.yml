# Weekly documentation refresh (docs/handbook/17-documentation-maintenance.md).
# Every Monday, regenerates docs/reference/ from the code and, if anything
# changed, pushes a docs/weekly-reference-<date> branch and opens a pull
# request into main for the owner to review. Nothing is merged automatically.
#
# The prose review of docs/handbook/ is a separate weekly pass by a person or
# an AI agent (prompt in §5 of that guide). Free on GitHub Actions; nothing here
# talks to Supabase or any other service.
#
# Opening the pull request needs Settings → Actions → General → "Allow GitHub
# Actions to create and approve pull requests". Without it the branch is still
# pushed and the job says how to open the pull request by hand.
name: Docs weekly

on:
  schedule:
    - cron: '15 0 * * 1' # Monday 06:00 in Kathmandu
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-weekly
  cancel-in-progress: false

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run docs:generate
      - name: Open a pull request if the reference changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain docs/reference)" ]; then
            echo "docs/reference is up to date; nothing to do."
            exit 0
          fi
          day=$(date -u +%F)
          branch="docs/weekly-reference-$day"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add docs/reference
          git commit -m "Regenerate the code reference ($day)" -m "Weekly run of npm run docs:generate. Review the handbook guides that cover the changed areas (docs/handbook/17-documentation-maintenance.md)."
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Weekly code reference refresh ($day)" \
            --body "Generated by .github/workflows/docs-weekly.yml (npm run docs:generate). Only docs/reference/ changed. Before merging, check that the handbook guides covering these areas are still accurate (docs/handbook/17-documentation-maintenance.md §3)." \
          || echo "::warning::Could not open the pull request automatically. Open one from $branch into main."
